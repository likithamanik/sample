         function Division() {
            var num1 = document.getElementById("num1").value;

        }

        function multiply() {
            var num1 = document.getElementById("num1").value;
            var num2 = document.getElementById("num2").value;
            var result = num1 * num2;
            document.getElementById("result").innerHTML = "Result: " + result;
        }
        function subtraction() {
            var num1 = document.getElementById("num1").value;
            var num2 = document.getElementById("num2").value;
            var result = num1 - num2;
            document.getElementById("result").innerHTML = "Result: " + result;
        }
</script>
